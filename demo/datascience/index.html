  cursor: var(--cursor-interaction, default);
}

.form-select:not(:disabled):hover {
  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible,
.nav-link:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {

  .nav-link,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;

  .form-select {

  }

  .form-control[type=&quot;file&quot;]::file-selector-button {

    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {

  }

    left: 50%;

    height: 44px;

  }

  .form-check-label {

  }

  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {

}

  flex: none;

}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

&lt;script type=&quot;application/json&quot; id=&quot;codex-visualization-widget-state&quot;&gt;__CODEX_VISUALIZATION_WIDGET_STATE__&lt;/script&gt;

  const isArray = Array.isArray;

  );

  initialStateElement?.remove();

  let state = initialGlobals.widgetState ?? null;
  const statePersistence = initialGlobals.statePersistence ?? &quot;none&quot;;
  let nextStateRequestId = 0;
  /** @type {Map&lt;number, { resolve: () =&gt; void; reject: (error: Error) =&gt; void; timeout: ReturnType&lt;typeof globalThis.setTimeout&gt;; serializedState: string }&gt;} */
  const pendingStateWrites = new Map();
  const persistenceError = () =&gt;
    Object.assign(
      new Error(&quot;The host could not persist the widget state update&quot;),
      {
        code: -32000,
        data: { code: &quot;widget_state_persistence_failed&quot;, retryable: false },
      },
    );
  /**

   * @param {string} property

  const getPrototypeGetter = (prototype, property) =&gt; {
    // oxlint-disable-next-line typescript/unbound-method -- invoked through captured Reflect.apply

    if (getter == null) {
      throw new Error(`Missing ${property} getter`);
    }
    return getter;
  };
  const getMessageData = getPrototypeGetter(MessageEvent.prototype, &quot;data&quot;);
  const getMessagePorts = getPrototypeGetter(MessageEvent.prototype, &quot;ports&quot;);
  const getMessageSource = getPrototypeGetter(MessageEvent.prototype, &quot;source&quot;);

  const addHostMessageListener = MessagePort.prototype.addEventListener;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const postHostMessage = MessagePort.prototype.postMessage;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const startHostPort = MessagePort.prototype.start;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const stopMessagePropagation = Event.prototype.stopImmediatePropagation;

  let hostPort = null;
  const postToHost = (type, payload) =&gt; {

      apply(postHostMessage, hostPort, [{ type, ...payload }]);
    }
  };

    const nextState = typeof next === &quot;function&quot; ? next(state) : next;

      nextState == null ||
      typeof nextState !== &quot;object&quot; ||
      isArray(nextState)

      throw new TypeError(&quot;Widget state must be a JSON object&quot;);

      nextState,
      (_key, /** @type {unknown} */ value) =&gt; {

          typeof value === &quot;function&quot; ||
          typeof value === &quot;symbol&quot; ||
          (typeof value === &quot;number&quot; &amp;&amp; !Number.isFinite(value))

      parsedState == null ||
      typeof parsedState !== &quot;object&quot; ||
      isArray(parsedState)

      throw new TypeError(&quot;Widget state must be a JSON object&quot;);

      modelContent: null,
      privateContent: null,
      ...parsedState,

      hasOwn(storedState, &quot;imageIds&quot;) &amp;&amp;

        storedState.imageIds.some(

      throw new TypeError(&quot;Widget state imageIds must be an array of strings&quot;);
    }

    globalThis.openai.widgetState = state;
    globalThis.dispatchEvent(
      new CustomEvent(&quot;openai:set_globals&quot;, {
        detail: { globals: { widgetState: state } },
      }),
    );

      throw persistenceError();
    }
    const id = ++nextStateRequestId;
    return new Promise((resolve, reject) =&gt; {
      const timeout = globalThis.setTimeout(() =&gt; {
        pendingStateWrites.delete(id);
        reject(persistenceError());
      }, 30_000);
      pendingStateWrites.set(id, { resolve, reject, timeout, serializedState });
      postToHost(&quot;widget-state-write&quot;, { id, state: serializedState });
    });
  };
  const syncTheme = () =&gt; {
    const theme = mediaQuery.matches ? &quot;dark&quot; : &quot;light&quot;;
    root.dataset.theme = theme;
    globalThis.openai = {
      ...globalThis.openai,
      openExternal,
      sendFollowUpMessage,
      setWidgetState,
      theme,
      visualizationStyleVariables: {},
      visualizationTheme: theme,
      widgetState: state,
      statePersistence,
      stateModelContext: &quot;none&quot;,
    };
    globalThis.dispatchEvent(
      new CustomEvent(&quot;openai:set_globals&quot;, {
        detail: { globals: globalThis.openai },
      }),
    );
  };
  const sendHeight = () =&gt; {
    postToHost(&quot;height&quot;, {
      height: Math.ceil(
        Math.max(
          document.body.scrollHeight,
          document.body.getBoundingClientRect().height,
        ),
      ),
    });
  };

  globalThis.addEventListener(
    &quot;message&quot;,
    (event) =&gt; {
      const data = apply(getMessageData, event, []);
      const ports = apply(getMessagePorts, event, []);
      const source = apply(getMessageSource, event, []);
      if (
        hostPort != null ||
        source !== parentWindow ||
        typeof data !== &quot;object&quot; ||
        data?.type !== &quot;codex-visualization-initialize&quot; ||
        !isArray(ports) ||
        ports.length !== 1
      ) {
        return;
      }
      apply(stopMessagePropagation, event, []);
      const nextHostPort = ports[0];
      try {
        apply(addHostMessageListener, nextHostPort, [
          &quot;message&quot;,
          (event) =&gt; {
            const data = apply(getMessageData, event, []);
            if (typeof data === &quot;object&quot; &amp;&amp; data?.type === &quot;measure&quot;) {
              sendHeight();
            } else if (
              typeof data === &quot;object&quot; &amp;&amp;
              data?.type === &quot;widget-state-result&quot;
            ) {
              /** @type {unknown} */
              const id = data.id;
              if (typeof id !== &quot;number&quot;) {
                return;
              }
              const pending = pendingStateWrites.get(id);
              if (pending != null) {
                pendingStateWrites.delete(id);
                globalThis.clearTimeout(pending.timeout);
                if (data.ok === true) {
                  pending.resolve();
                } else {
                  pending.reject(persistenceError());
                }
              }
            }
          },
        ]);
        apply(startHostPort, nextHostPort, []);
      } catch {
        return;
      }
      hostPort = nextHostPort;
      for (const [id, { serializedState }] of pendingStateWrites) {
        postToHost(&quot;widget-state-write&quot;, { id, state: serializedState });
      }
      sendHeight();
    },
    { capture: true },
  );
  document.currentScript?.remove();
  mediaQuery.addEventListener(&quot;change&quot;, syncTheme);
  globalThis.addEventListener(&quot;click&quot;, (event) =&gt; {
    if (event.defaultPrevented) {
      return;
    }
    let element = null;
    if (event.target instanceof globalThis.Element) {
      element = event.target;
    } else if (event.target instanceof globalThis.Node) {
      element = event.target.parentElement;
    }
    const link = element?.closest(&quot;a[href]&quot;);
    const href = link?.getAttribute(&quot;href&quot;);
    if (href == null) {
      return;
    }
    if (href.startsWith(&quot;#&quot;)) {
      let id;
      try {
        id = decodeURIComponent(href.slice(1));
      } catch {
        return;
      }
      const target = id.length === 0 ? root : document.getElementById(id);
      if (
        target == null ||
        globalThis.navigator.userActivation?.isActive !== true

        return;
      }

      });
      return;
    }

  });

  syncTheme();
})();

&lt;div id=&quot;correlation-explorer&quot;&gt;
  &lt;h1&gt;Data science essentials&lt;/h1&gt;
  &lt;div class=&quot;nav nav-pills&quot; role=&quot;tablist&quot; aria-label=&quot;Data science topic&quot;&gt;
    &lt;button class=&quot;nav-link active&quot; id=&quot;correlation-tab&quot; role=&quot;tab&quot; aria-controls=&quot;correlation-panel&quot; aria-selected=&quot;true&quot; type=&quot;button&quot;&gt;Correlation&lt;/button&gt;
    &lt;button class=&quot;nav-link&quot; id=&quot;standardization-tab&quot; role=&quot;tab&quot; aria-controls=&quot;standardization-panel&quot; aria-selected=&quot;false&quot; type=&quot;button&quot;&gt;Standardization&lt;/button&gt;
  &lt;/div&gt;
  &lt;section id=&quot;correlation-panel&quot; role=&quot;tabpanel&quot; aria-labelledby=&quot;correlation-tab&quot;&gt;
  &lt;h2&gt;Correlation: two standardized variables&lt;/h2&gt;
  &lt;label class=&quot;form-label&quot; for=&quot;correlation-slider&quot;&gt;Pearson correlation r = &lt;output id=&quot;correlation-value&quot; class=&quot;tabular-nums&quot;&gt;0.00&lt;/output&gt;&lt;/label&gt;
  &lt;input class=&quot;form-range&quot; id=&quot;correlation-slider&quot; type=&quot;range&quot; min=&quot;-1&quot; max=&quot;1&quot; step=&quot;0.01&quot; value=&quot;0&quot; /&gt;
  &lt;div class=&quot;correlation-endpoints text-small&quot;&gt;&lt;span&gt;−1 · opposite directions&lt;/span&gt;&lt;span&gt;0&lt;/span&gt;&lt;span&gt;+1 · same direction&lt;/span&gt;&lt;/div&gt;
  &lt;div id=&quot;correlation-chart&quot;&gt;&lt;svg role=&quot;img&quot; class=&quot;correlation-plot&quot; aria-label=&quot;Scatterplot of standardized X and Y&quot;&gt;&lt;/svg&gt;&lt;/div&gt;
  &lt;div id=&quot;correlation-detail&quot; class=&quot;text-small&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;
  &lt;div class=&quot;text-small&quot;&gt;120 observations · Both means = 0 · Both sample SDs = 1&lt;/div&gt;
  &lt;div id=&quot;correlation-accessible&quot; class=&quot;sr-only&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;
  &lt;h3&gt;Computing Pearson correlation&lt;/h3&gt;
  &lt;div class=&quot;formula&quot;&gt;r = Σᵢ (xᵢ − x̄)(yᵢ − ȳ) / √[Σᵢ (xᵢ − x̄)² · Σᵢ (yᵢ − ȳ)²]&lt;/div&gt;
  &lt;div class=&quot;formula&quot;&gt;For standardized values: r = Σᵢ zₓᵢ zᵧᵢ / (n − 1)&lt;/div&gt;
  &lt;p class=&quot;text-small&quot;&gt;The sums run over all n observations; x̄ and ȳ are the sample means. Same-sign deviations contribute positively; opposite-sign deviations contribute negatively. Correlation measures linear association.&lt;/p&gt;
  &lt;hr&gt;
  &lt;h2&gt;Look beyond the coefficient&lt;/h2&gt;
  &lt;p class=&quot;text-small&quot;&gt;27 synthetic examples in four galleries. Each r is computed from the plotted points; examples stay fixed when you move the slider above.&lt;/p&gt;
  &lt;div id=&quot;correlation-cases&quot;&gt;&lt;/div&gt;
  &lt;p class=&quot;text-small&quot;&gt;Original synthetic recreations inspired by &lt;a href=&quot;https://commons.wikimedia.org/wiki/File:Correlation_examples2.svg&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;Wikimedia’s correlation examples&lt;/a&gt;, with additional teaching cases.&lt;/p&gt;
  &lt;p class=&quot;text-small&quot;&gt;Always plot the data: check curvature, unusual points, groups, and changing spread. Correlation alone does not establish causation.&lt;/p&gt;
  &lt;/section&gt;
  &lt;section id=&quot;standardization-panel&quot; role=&quot;tabpanel&quot; aria-labelledby=&quot;standardization-tab&quot; hidden&gt;
  &lt;h2&gt;Standardization: three machine-learning features&lt;/h2&gt;
  &lt;div class=&quot;formula&quot;&gt;Mean: x̄ = (Σᵢ xᵢ) / n&lt;/div&gt;
  &lt;div class=&quot;formula&quot;&gt;Sample standard deviation: sₓ = √[Σᵢ (xᵢ − x̄)² / (n − 1)]&lt;/div&gt;
  &lt;div class=&quot;formula&quot;&gt;Standardized value: zᵢ = (xᵢ − x̄) / sₓ&lt;/div&gt;
  &lt;p class=&quot;text-small&quot;&gt;Apply this separately to each feature: subtract its mean, then divide by its standard deviation. The result has mean 0 and sample standard deviation 1; its shape and ordering stay the same. This demo uses n − 1; some ML libraries use n for variance.&lt;/p&gt;
  &lt;div class=&quot;text-small&quot;&gt;120 synthetic people · Original units → standard deviations from the mean&lt;/div&gt;
  &lt;div id=&quot;standardization-chart&quot;&gt;&lt;/div&gt;
  &lt;p class=&quot;text-small&quot;&gt;For machine learning, compute the mean and standard deviation on the training data, then reuse them for validation, test, and new data. A constant feature needs special handling because its standard deviation is zero.&lt;/p&gt;
  &lt;/section&gt;

#correlation-explorer .correlation-endpoints span:nth-child(2) {text-align:center;}
#correlation-explorer .correlation-endpoints span:last-child {text-align:right;}
#correlation-explorer .correlation-plot {display:block;width:100%;overflow:visible;}
#correlation-explorer .correlation-plot text {fill:var(--foreground);font-size:12px;}
#correlation-explorer #correlation-detail {min-height:24px;}
#correlation-explorer .feature-pair {display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;}
#correlation-explorer .feature-panel {min-width:0;}
#correlation-explorer .case-grid {display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px 16px;}
#correlation-explorer .case-panel {min-width:0;}
#correlation-explorer .case-gallery {margin-top:28px;}
@media(min-width:721px){#correlation-explorer .case-grid.seven .case-panel:last-child {grid-column:2;}}
#correlation-explorer .case-panel h3 {min-height:40px;}
@media(max-width:720px){#correlation-explorer .case-grid {grid-template-columns:repeat(2,minmax(0,1fr));}}
@media(max-width:480px){#correlation-explorer .case-grid {grid-template-columns:1fr;}}
@media(max-width:580px){#correlation-explorer .feature-pair {grid-template-columns:1fr;}}

&lt;script src=&quot;https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(()=&gt;{
  const root=document.getElementById(&#x27;correlation-explorer&#x27;);
  const slider=root.querySelector(&#x27;#correlation-slider&#x27;);
  const value=root.querySelector(&#x27;#correlation-value&#x27;);
  const detail=root.querySelector(&#x27;#correlation-detail&#x27;);
  const svg=d3.select(root.querySelector(&#x27;svg&#x27;));
  let seed=719;
  const uniform=()=&gt;{seed=(Math.imul(seed,1664525)+1013904223)&gt;&gt;&gt;0;return (seed+0.5)/4294967296;};
  const normal=()=&gt;Math.sqrt(-2*Math.log(uniform()))*Math.cos(2*Math.PI*uniform());
  const standardize=a=&gt;{const mean=d3.mean(a),sd=d3.deviation(a);return a.map(v=&gt;(v-mean)/sd);};
  const x=standardize(d3.range(120).map(normal));
  const noise=standardize(d3.range(120).map(normal));
  const projection=d3.sum(x,(v,i)=&gt;v*noise[i])/(x.length-1);
  const e=standardize(noise.map((v,i)=&gt;v-projection*x[i]));
  // Orthogonal centered vectors make the sample correlation exactly r;
  // Y keeps sample mean 0 and sample SD 1 for every slider value.
  const bounds=d3.extent(x.flatMap((v,i)=&gt;[-Math.hypot(v,e[i]),Math.hypot(v,e[i])]));
  const pad=(bounds[1]-bounds[0])*0.04;
  const domain=[bounds[0]-pad,bounds[1]+pad];
  let r=0,scales,points=[],selected=null;
  const fmt=v=&gt;Math.abs(v)&lt;0.005?&#x27;0.00&#x27;:d3.format(&#x27;+.2f&#x27;)(v);
  function restore(saved){const v=saved?.modelContent?.correlation;if(Number.isFinite(v))r=Math.max(-1,Math.min(1,v));}
  restore(window.openai?.widgetState);
  function updateDetail(){
    detail.textContent=selected===null ? (r===0?&#x27;No linear association&#x27;:Math.abs(r)===1?&#x27;Perfect &#x27;+(r&gt;0?&#x27;positive&#x27;:&#x27;negative&#x27;)+&#x27; linear association&#x27;:(r&gt;0?&#x27;Positive&#x27;:&#x27;Negative&#x27;)+&#x27; linear association&#x27;) : `Observation ${selected+1}: X = ${fmt(points[selected].x)} SD · Y = ${fmt(points[selected].y)} SD`;
  }
  function render(animate=false){
    slider.value=r;value.textContent=fmt(r);
    slider.setAttribute(&#x27;aria-valuetext&#x27;,`Correlation ${r.toFixed(2)}`);
    points=x.map((v,i)=&gt;({x:v,y:r*v+Math.sqrt(Math.max(0,1-r*r))*e[i]}));
    const width=root.querySelector(&#x27;#correlation-chart&#x27;).getBoundingClientRect().width;
    if(!width)return;
    const left=64,right=18,top=24,bottom=58;
    const side=Math.max(140,Math.min(width-left-right,430));
    const height=side+top+bottom;
    const l=left+(width-left-right-side)/2,rr=l+side,t=top,b=t+side;
    const sx=d3.scaleLinear().domain(domain).range([l+7,rr-7]);
    const sy=d3.scaleLinear().domain(domain).range([b-7,t+7]);
    scales={sx,sy};
    svg.attr(&#x27;viewBox&#x27;,`0 0 ${width} ${height}`).attr(&#x27;height&#x27;,height).attr(&#x27;aria-label&#x27;,`120 standardized observations. Pearson correlation ${r.toFixed(2)}. Both variables have mean zero and sample standard deviation one.`);
    svg.selectAll(&#x27;g.structure&#x27;).remove();
    const g=svg.insert(&#x27;g&#x27;,&#x27;:first-child&#x27;).attr(&#x27;class&#x27;,&#x27;structure&#x27;);
    g.append(&#x27;rect&#x27;).attr(&#x27;data-chart-frame&#x27;,&#x27;&#x27;).attr(&#x27;x&#x27;,l).attr(&#x27;y&#x27;,t).attr(&#x27;width&#x27;,side).attr(&#x27;height&#x27;,side).attr(&#x27;fill&#x27;,&#x27;none&#x27;).attr(&#x27;stroke&#x27;,&#x27;var(--border)&#x27;);
    [[l,sy(0),rr,sy(0)],[sx(0),t,sx(0),b]].forEach(p=&gt;g.append(&#x27;line&#x27;).attr(&#x27;x1&#x27;,p[0]).attr(&#x27;y1&#x27;,p[1]).attr(&#x27;x2&#x27;,p[2]).attr(&#x27;y2&#x27;,p[3]).attr(&#x27;stroke&#x27;,&#x27;var(--border)&#x27;));
    const ticks=width&lt;400?3:5;
    g.append(&#x27;g&#x27;).attr(&#x27;transform&#x27;,`translate(0,${b})`).call(d3.axisBottom(sx).ticks(ticks).tickSizeOuter(0));
    g.append(&#x27;g&#x27;).attr(&#x27;transform&#x27;,`translate(${l},0)`).call(d3.axisLeft(sy).ticks(ticks).tickSizeOuter(0));
    g.append(&#x27;text&#x27;).attr(&#x27;class&#x27;,&#x27;axis-title&#x27;).attr(&#x27;data-axis&#x27;,&#x27;x&#x27;).attr(&#x27;x&#x27;,(l+rr)/2).attr(&#x27;y&#x27;,height-12).attr(&#x27;text-anchor&#x27;,&#x27;middle&#x27;).text(&#x27;Standardized X (SD from mean)&#x27;);
    g.append(&#x27;text&#x27;).attr(&#x27;class&#x27;,&#x27;axis-title&#x27;).attr(&#x27;data-axis&#x27;,&#x27;y&#x27;).attr(&#x27;transform&#x27;,`translate(${l-46},${(t+b)/2}) rotate(-90)`).attr(&#x27;text-anchor&#x27;,&#x27;middle&#x27;).text(&#x27;Standardized Y (SD from mean)&#x27;);
    const marks=svg.selectAll(&#x27;circle.observation&#x27;).data(points).join(&#x27;circle&#x27;).attr(&#x27;class&#x27;,&#x27;observation&#x27;).attr(&#x27;r&#x27;,4).attr(&#x27;fill&#x27;,&#x27;var(--viz-series-1)&#x27;).attr(&#x27;fill-opacity&#x27;,0.65);
    marks.interrupt();
    const target=animate&amp;&amp;!matchMedia(&#x27;(prefers-reduced-motion: reduce)&#x27;).matches?marks.transition().duration(80).ease(d3.easeLinear):marks;
    target.attr(&#x27;cx&#x27;,d=&gt;sx(d.x)).attr(&#x27;cy&#x27;,d=&gt;sy(d.y));
    svg.selectAll(&#x27;rect.hit&#x27;).data([0]).join(&#x27;rect&#x27;).attr(&#x27;class&#x27;,&#x27;hit&#x27;).attr(&#x27;data-chart-hit&#x27;,&#x27;&#x27;).attr(&#x27;x&#x27;,l).attr(&#x27;y&#x27;,t).attr(&#x27;width&#x27;,side).attr(&#x27;height&#x27;,side).attr(&#x27;fill&#x27;,&#x27;transparent&#x27;).on(&#x27;pointermove&#x27;,event=&gt;{
      if(event.pointerType===&#x27;touch&#x27;)return;
      const [px,py]=d3.pointer(event,svg.node());selectNearest(px,py);
    }).on(&#x27;click&#x27;,event=&gt;{const [px,py]=d3.pointer(event,svg.node());selectNearest(px,py);}).on(&#x27;pointerleave&#x27;,()=&gt;{selected=null;updateDetail();});
    const labels=[...svg.node().querySelectorAll(&#x27;.tick text,.axis-title&#x27;)].map(el=&gt;({el,box:el.getBoundingClientRect()}));
    for(let i=0;i&lt;labels.length;i++)for(let j=i+1;j&lt;labels.length;j++){
      const a=labels[i].box,b=labels[j].box;
      if(a.width&amp;&amp;b.width&amp;&amp;a.left&lt;b.right+4&amp;&amp;a.right+4&gt;b.left&amp;&amp;a.top&lt;b.bottom+4&amp;&amp;a.bottom+4&gt;b.top){const tick=labels[j].el.closest(&#x27;.tick&#x27;)?labels[j].el:labels[i].el.closest(&#x27;.tick&#x27;)?labels[i].el:null;if(tick)tick.style.visibility=&#x27;hidden&#x27;;}
    }
    updateDetail();
    drawStandardization(animate);
  }
  function drawStandardization(){
    if(!root.querySelector(&#x27;#standardization-chart&#x27;).getBoundingClientRect().width)return;
    const features=[
      {name:&#x27;Age&#x27;,unit:&#x27;years&#x27;,values:x.map(v=&gt;45+8*v)},
      {name:&#x27;Annual income&#x27;,unit:&#x27;USD / year&#x27;,values:e.map(v=&gt;50000*Math.exp(0.45*v))},
      {name:&#x27;Weekly work&#x27;,unit:&#x27;hours / week&#x27;,values:x.map((v,i)=&gt;36+5*(0.6*v+0.8*e[i]))}
    ].map(f=&gt;({...f,mean:d3.mean(f.values),sd:d3.deviation(f.values),z:standardize(f.values)}));
    const zExtent=d3.extent(features.flatMap(f=&gt;f.z).concat([-1,1]));
    const zPad=(zExtent[1]-zExtent[0])*0.08;
    const zDomain=[zExtent[0]-zPad,zExtent[1]+zPad];
    const container=d3.select(root.querySelector(&#x27;#standardization-chart&#x27;));
    const rows=container.selectAll(&#x27;section.feature-row&#x27;).data(features).join(&#x27;section&#x27;).attr(&#x27;class&#x27;,&#x27;feature-row&#x27;);
    rows.each(function(f){
      const section=d3.select(this);
      section.selectAll(&#x27;h3&#x27;).data([f]).join(&#x27;h3&#x27;).text(f.name);
      const pair=section.selectAll(&#x27;div.feature-pair&#x27;).data([f]).join(&#x27;div&#x27;).attr(&#x27;class&#x27;,&#x27;feature-pair&#x27;);
      const panels=pair.selectAll(&#x27;div.feature-panel&#x27;).data([false,true]).join(&#x27;div&#x27;).attr(&#x27;class&#x27;,&#x27;feature-panel&#x27;);
      const rawExtent=d3.extent(f.values.concat([f.mean-f.sd,f.mean+f.sd]));
      const rawPad=(rawExtent[1]-rawExtent[0])*0.08;
      const rawDomain=[rawExtent[0]-rawPad,rawExtent[1]+rawPad];
      const bins=d3.bin().domain(rawDomain).thresholds(12)(f.values);
      const ymax=d3.max(bins,b=&gt;b.length)*1.12;
      panels.each(function(after){
        const panel=d3.select(this);
        panel.selectAll(&#x27;div.feature-label&#x27;).data([0]).join(&#x27;div&#x27;).attr(&#x27;class&#x27;,&#x27;feature-label text-small tabular-nums&#x27;).text(after?&#x27;Standardized · mean 0 · SD 1&#x27;:`Original · mean ${d3.format(&#x27;,.1f&#x27;)(f.mean)} · SD ${d3.format(&#x27;,.1f&#x27;)(f.sd)}`);
        const plot=panel.selectAll(&#x27;svg&#x27;).data([0]).join(&#x27;svg&#x27;).attr(&#x27;class&#x27;,&#x27;correlation-plot&#x27;).attr(&#x27;role&#x27;,&#x27;img&#x27;);
        const width=this.getBoundingClientRect().width,height=205,left=64,right=14,top=26,bottom=149;
        const axisDomain=after?zDomain:rawDomain;
        const sx=d3.scaleLinear().domain(axisDomain).range([left+5,width-right-5]);
        const sy=d3.scaleLinear().domain([0,ymax]).range([bottom,top]);
        const convert=v=&gt;after?(v-f.mean)/f.sd:v;
        plot.attr(&#x27;viewBox&#x27;,`0 0 ${width} ${height}`).attr(&#x27;height&#x27;,height).attr(&#x27;aria-label&#x27;,`${f.name}, ${after?&#x27;standardized: mean zero and sample standard deviation one&#x27;:&#x27;original units: mean &#x27;+f.mean.toFixed(1)+&#x27; and sample standard deviation &#x27;+f.sd.toFixed(1)}. Histogram shape preserved.`);
        plot.selectAll(&#x27;*&#x27;).remove();
        plot.append(&#x27;rect&#x27;).attr(&#x27;data-chart-frame&#x27;,&#x27;&#x27;).attr(&#x27;x&#x27;,left).attr(&#x27;y&#x27;,top).attr(&#x27;width&#x27;,width-left-right).attr(&#x27;height&#x27;,bottom-top).attr(&#x27;fill&#x27;,&#x27;none&#x27;).attr(&#x27;stroke&#x27;,&#x27;var(--border)&#x27;);
        plot.append(&#x27;rect&#x27;).attr(&#x27;x&#x27;,sx(convert(f.mean-f.sd))).attr(&#x27;y&#x27;,top).attr(&#x27;width&#x27;,sx(convert(f.mean+f.sd))-sx(convert(f.mean-f.sd))).attr(&#x27;height&#x27;,bottom-top).attr(&#x27;fill&#x27;,&#x27;var(--muted)&#x27;).attr(&#x27;opacity&#x27;,0.65);
        plot.selectAll(&#x27;rect.bar&#x27;).data(bins).join(&#x27;rect&#x27;).attr(&#x27;class&#x27;,&#x27;bar&#x27;).attr(&#x27;x&#x27;,b=&gt;sx(convert(b.x0))+0.5).attr(&#x27;y&#x27;,b=&gt;sy(b.length)).attr(&#x27;width&#x27;,b=&gt;Math.max(0,sx(convert(b.x1))-sx(convert(b.x0))-1)).attr(&#x27;height&#x27;,b=&gt;bottom-sy(b.length)).attr(&#x27;fill&#x27;,&#x27;var(--viz-series-1)&#x27;).attr(&#x27;opacity&#x27;,0.7);
        plot.append(&#x27;line&#x27;).attr(&#x27;x1&#x27;,sx(convert(f.mean))).attr(&#x27;x2&#x27;,sx(convert(f.mean))).attr(&#x27;y1&#x27;,top).attr(&#x27;y2&#x27;,bottom).attr(&#x27;stroke&#x27;,&#x27;var(--foreground)&#x27;).attr(&#x27;stroke-width&#x27;,1);
        plot.append(&#x27;g&#x27;).attr(&#x27;transform&#x27;,`translate(0,${bottom})`).call(d3.axisBottom(sx).ticks(width&lt;400?3:5).tickFormat(after?d3.format(&#x27;~g&#x27;):d3.format(&#x27;~s&#x27;)).tickSizeOuter(0));
        plot.append(&#x27;g&#x27;).attr(&#x27;transform&#x27;,`translate(${left},0)`).call(d3.axisLeft(sy).ticks(3).tickFormat(d3.format(&#x27;d&#x27;)).tickSizeOuter(0));
        plot.append(&#x27;text&#x27;).attr(&#x27;class&#x27;,&#x27;axis-title&#x27;).attr(&#x27;data-axis&#x27;,&#x27;x&#x27;).attr(&#x27;x&#x27;,(left+width-right)/2).attr(&#x27;y&#x27;,height-10).attr(&#x27;text-anchor&#x27;,&#x27;middle&#x27;).text(after?&#x27;z-score (SD from mean)&#x27;:f.unit);
        plot.append(&#x27;text&#x27;).attr(&#x27;class&#x27;,&#x27;axis-title&#x27;).attr(&#x27;data-axis&#x27;,&#x27;y&#x27;).attr(&#x27;transform&#x27;,`translate(18,${(top+bottom)/2}) rotate(-90)`).attr(&#x27;text-anchor&#x27;,&#x27;middle&#x27;).text(&#x27;People&#x27;);
        plot.append(&#x27;text&#x27;).attr(&#x27;x&#x27;,left).attr(&#x27;y&#x27;,16).text(&#x27;Line: mean · band: ±1 SD&#x27;);
        const labels=[...plot.node().querySelectorAll(&#x27;.tick text,.axis-title&#x27;)].map(el=&gt;({el,b:el.getBoundingClientRect()}));
        for(let i=0;i&lt;labels.length;i++)for(let j=i+1;j&lt;labels.length;j++){const a=labels[i].b,b=labels[j].b;if(a.width&amp;&amp;b.width&amp;&amp;a.left&lt;b.right+4&amp;&amp;a.right+4&gt;b.left&amp;&amp;a.top&lt;b.bottom+4&amp;&amp;a.bottom+4&gt;b.top){const tick=labels[j].el.closest(&#x27;.tick&#x27;)?labels[j].el:labels[i].el.closest(&#x27;.tick&#x27;)?labels[i].el:null;if(tick)tick.style.visibility=&#x27;hidden&#x27;;}}
      });
    });
  }
  function save(){window.openai?.setWidgetState?.({modelContent:{correlation:r},privateContent:null}).catch(()=&gt;{});}
  function pearson(data){
    const mx=d3.mean(data,p=&gt;p.x),my=d3.mean(data,p=&gt;p.y);
    return d3.sum(data,p=&gt;(p.x-mx)*(p.y-my))/Math.sqrt(d3.sum(data,p=&gt;(p.x-mx)**2)*d3.sum(data,p=&gt;(p.y-my)**2));
  }
  const caseU=standardize(d3.range(61).map(i=&gt;(i-30)/15));
  const caseV=standardize(caseU.map(v=&gt;v*v));
  const ring=d3.range(40).map(i=&gt;({x:Math.cos(2*Math.PI*i/40),y:Math.sin(2*Math.PI*i/40)}));
  const grouped=[-1,1].flatMap(g=&gt;d3.range(20).map(i=&gt;{const t=(i-9.5)/10;return{x:3*g+t,y:-3*g+t,group:g===-1?0:1};}));
  const specialCases=[
    {title:&#x27;1. A linear pattern&#x27;,data:x.map((v,i)=&gt;({x:v,y:0.8*v+0.6*e[i]})),note:&#x27;A useful linear summary. Compare its r with the curved pattern next to it.&#x27;},
    {title:&#x27;2. Same r, curved pattern&#x27;,data:caseU.map((v,i)=&gt;({x:v,y:0.8*v+0.6*caseV[i]})),note:&#x27;The same r = +0.80 hides a systematic bend. A straight line misses the shape.&#x27;},
    {title:&#x27;3. One influential point&#x27;,data:[...ring,{x:12,y:12,outlier:true}],note:&#x27;The isolated diamond drives the result. Without it, r = &#x27;+fmt(pearson(ring))+&#x27;.&#x27;},
    {title:&#x27;4. Zero r, clear relationship&#x27;,data:caseU.map(v=&gt;({x:v,y:v*v})),note:&#x27;Y is determined by X², yet positive and negative linear contributions cancel.&#x27;},
    {title:&#x27;5. Hidden groups reverse it&#x27;,data:grouped,note:&#x27;Overall negative; within each group r = +1.00. ● Group A · ■ Group B.&#x27;},
    {title:&#x27;6. Changing spread&#x27;,data:d3.range(21).flatMap(i=&gt;{const v=i/5;return[-1,-0.5,0,0.5,1].map(a=&gt;({x:v,y:v+a*(0.15+0.7*v)}));}),note:&#x27;The uncertainty grows with X. One coefficient cannot describe this widening spread.&#x27;}
  ];
  // Independent synthetic samples; symmetry makes the zero-correlation
  // examples exact without claiming that zero correlation means independence.
  const reflectX=fn=&gt;d3.range(100).flatMap(()=&gt;{const a=uniform()*2,y=fn(a)+0.08*normal();return[{x:a,y},{x:-a,y}];});
  const quarterTurns=fn=&gt;d3.range(70).flatMap(()=&gt;{const p=fn();return[p,{x:-p.y,y:p.x},{x:-p.x,y:-p.y},{x:p.y,y:-p.x}];});
  const tiltedSquare=angle=&gt;quarterTurns(()=&gt;{const a=2*uniform()-1,b=2*uniform()-1;return{x:a*Math.cos(angle)-b*Math.sin(angle),y:a*Math.sin(angle)+b*Math.cos(angle)};});
  const strengths=[1,0.8,0.4,0,-0.4,-0.8,-1].map(v=&gt;({title:&#x27;Correlation &#x27;+fmt(v),data:x.map((a,i)=&gt;({x:a,y:v*a+Math.sqrt(Math.max(0,1-v*v))*e[i]})),note:v===0?&#x27;No linear trend in this cloud.&#x27;:Math.abs(v)===1?&#x27;All points lie on a straight line.&#x27;:`A ${v&gt;0?&#x27;positive&#x27;:&#x27;negative&#x27;} linear association.`}));
  const slopes=[2,1,0.25,0,-0.25,-1,-2].map(m=&gt;({title:&#x27;Slope &#x27;+fmt(m),data:d3.range(41).map(i=&gt;({x:(i-20)/10,y:m*(i-20)/10})),note:m===0?&#x27;Y is constant: its standard deviation is zero, so r is undefined.&#x27;:&#x27;Different steepness, still a perfect &#x27;+(m&gt;0?&#x27;positive&#x27;:&#x27;negative&#x27;)+&#x27; linear relationship.&#x27;}));
  const zeroCases=[
    {title:&#x27;W-shaped wave&#x27;,data:reflectX(a=&gt;Math.cos(Math.PI*a)),note:&#x27;A repeating, nonlinear pattern cancels in the linear summary.&#x27;},
    {title:&#x27;Tilted square&#x27;,data:tiltedSquare(Math.PI/8),note:&#x27;The tilted boundary constrains combinations of X and Y, despite zero r.&#x27;},
    {title:&#x27;Diamond&#x27;,data:tiltedSquare(Math.PI/4),note:&#x27;Extreme X values allow less variation in Y. Zero r hides this dependence.&#x27;},
    {title:&#x27;U-shaped curve&#x27;,data:reflectX(a=&gt;a*a),note:&#x27;Large magnitudes of X predict larger Y, regardless of the sign of X.&#x27;},
    {title:&#x27;Crossing curves&#x27;,data:d3.range(70).flatMap(()=&gt;{const a=2*uniform(),b=a*a+0.1*normal();return[{x:a,y:b},{x:a,y:-b},{x:-a,y:b},{x:-a,y:-b}];}),note:&#x27;Opposite branches cancel, even though the shape is highly structured.&#x27;},
    {title:&#x27;Circular relationship&#x27;,data:quarterTurns(()=&gt;{const a=uniform()*2*Math.PI,radius=1+0.04*normal();return{x:radius*Math.cos(a),y:radius*Math.sin(a)};}),note:&#x27;X constrains the possible Y values, but there is no linear direction.&#x27;},
    {title:&#x27;Four clusters&#x27;,data:d3.range(60).flatMap(()=&gt;{const a=1+0.13*normal(),b=1+0.13*normal();return[{x:a,y:b},{x:a,y:-b},{x:-a,y:b},{x:-a,y:-b}];}),note:&#x27;The overall coefficient misses the four groups. Clusters alone do not prove dependence.&#x27;}
  ];
  const galleries=[

        return;
      }
      let href;
      try {
        const url = new URL(rawHref, document.baseURI);
        if (url.protocol !== "https:") {
          return;
        }
        href = url.href;
      } catch {
        return;
      }
      if (globalThis.navigator.userActivation?.isActive === true) {
        const anchor = document.createElement("a");
        anchor.href = href;
        anchor.rel = "noopener noreferrer";
        anchor.target = "_blank";
        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();
      }
      return;
    }
    if (data.type === "follow-up") {
      const prompt = data.prompt;
      if (
        typeof prompt !== "string" ||
        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }
      const title = data.title;
      globalThis.prompt(typeof title === "string" ? title : prompt, prompt);
    }
  });
  channel.port1.start();
  const srcdoc = frame.dataset.srcdoc;
  if (srcdoc == null) {
    return;
  }
  globalThis.addEventListener("resize", () => {
    const height = Number.parseFloat(frame.style.height);
    if (!Number.isFinite(height) || height <= viewportHeight) {
      frame.style.removeProperty("height");
    }
    viewportHeight = globalThis.innerHeight;
    channel.port1.postMessage({ type: "measure" });
  });
  frame.addEventListener(
    "load",
    () => {
      frame.contentWindow?.postMessage(
        { type: "codex-visualization-initialize" },
        "*",
        [channel.port2],
      );
    },
    { once: true },
  );
  // Match the trusted bootstrap element, not the same text in an authored title.
  frame.srcdoc = srcdoc.replace(
    '<script type="application/json" id="codex-visualization-widget-state">__CODEX_VISUALIZATION_WIDGET_STATE__<\/script>',
    () =>
      '<script type="application/json" id="codex-visualization-widget-state">' +
      JSON.stringify(initialGlobals).replaceAll("<", "\\u003c") +
      "<\/script>",
  );
  delete frame.dataset.srcdoc;
})();
</script>
